# Mantiene este repositorio al dia con shaeon/Lynx_MiSTer (rama main) y con
# los submodulos (los cores de Kyp: rtl/lynx y rtl/lynx128).
#
# Cada noche (o a mano: Actions > Sync > Run workflow):
#   1. Trae upstream/main y lo mezcla con main.
#      - Los conflictos en releases/ se resuelven solos quitando el fichero.
#      - Los conflictos en un submodulo se resuelven solos con el commit de
#        upstream (en el paso 2 se sube de todas formas al ultimo).
#      - Cualquier otro conflicto (por ejemplo en sys/ si cambia el framework
#        de MiSTer) para el workflow y se avisa en el resumen: hay que
#        resolverlo a mano. No se compila ni se publica nada.
#   2. Sube cada submodulo al ultimo commit de su rama en su repositorio
#      (git submodule update --remote) y sus submodulos anidados (el T80) a lo
#      que fije ese commit.
#   3. Quita de releases/ todo RBF que no termine en _ch96.rbf (los de la
#      DE10-Nano no deben llegar al actualizador de la Chameleon96).
#   4. Si algo ha cambiado (1 o 2), sube el resultado y lanza build_ch96.yml.
#      build_ch96.yml solo guarda el RBF nuevo en releases/ si compila bien, y
#      el actualizador de la Chameleon96 lo recoge de ahi. Si no compila, no se
#      publica nada y el error sale en Actions.
#
# Un push hecho con GITHUB_TOKEN no lanza otros workflows; por eso se lanza
# la compilacion con "gh workflow run" (workflow_dispatch si funciona).

name: Sync

on:
  schedule:
    - cron: '23 3 * * *'      # 03:23 UTC
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  UPSTREAM: https://github.com/shaeon/Lynx_MiSTer.git

jobs:
  sync:
    if: github.repository == 'shaeon/Lynx_MiSTer_ch96'
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Mezclar con shaeon/Lynx_MiSTer
        id: sync
        run: |
          git config user.name "Shaeon (Carlos Palmero)"
          git config user.email "shaeon@users.noreply.github.com"
          git remote add upstream "$UPSTREAM"
          git fetch --quiet upstream main

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Ya esta al dia con upstream $(git rev-parse --short upstream/main)" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "merged=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git merge --no-ff --no-commit upstream/main || true

          git diff --name-only --diff-filter=U | while read -r f; do
            if [ "$(git ls-tree upstream/main -- "$f" | awk '{print $1}')" = 160000 ]; then
              # submodulo: el commit de upstream (el paso siguiente lo sube al ultimo)
              git update-index --cacheinfo "160000,$(git rev-parse "upstream/main:$f"),$f"
            elif [ "${f#releases/}" != "$f" ]; then
              git rm -q -f -- "$f"
            fi
          done

          LEFT=$(git diff --name-only --diff-filter=U)
          if [ -n "$LEFT" ]; then
            {
              echo "## Conflictos al sincronizar con upstream/main"
              echo "Hay que resolverlos a mano. No se compila ni se publica nada."
              echo '```'
              echo "$LEFT"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "$LEFT" | while read -r f; do echo "::error title=Conflicto::$f"; done
            exit 1
          fi

          git commit -q -m "Sincronizar con shaeon/Lynx_MiSTer ($(git rev-parse --short upstream/main))"
          {
            echo "## Sincronizado con upstream/main $(git rev-parse --short upstream/main)"
            echo '```'
            git log --oneline HEAD^1..HEAD^2 | head -30
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "merged=true" >> "$GITHUB_OUTPUT"

      - name: Actualizar los submodulos
        id: subs
        run: |
          PATHS=$(git config -f .gitmodules --get-regexp '^submodule\..*\.path$' | awk '{print $2}')
          git submodule update --init --recursive --quiet
          for p in $PATHS; do echo "$p $(git -C "$p" rev-parse HEAD)"; done > /tmp/subs_old.txt
          # solo el primer nivel sigue su rama; los anidados (T80) van a lo que fije su padre
          git submodule update --remote --quiet
          git add $PATHS        # antes que lo siguiente: si no, vuelve al commit fijado
          git submodule update --init --recursive --quiet

          if git diff --cached --quiet; then
            echo "Submodulos al dia" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          MSG="Submodulos:"
          echo "## Submodulos actualizados" >> "$GITHUB_STEP_SUMMARY"
          while read -r p old; do
            new=$(git -C "$p" rev-parse HEAD)
            [ "$old" = "$new" ] && continue
            MSG="$MSG $p ${new:0:7}"
            {
              echo "### $p: ${old:0:7} -> ${new:0:7}"
              echo '```'
              git -C "$p" log --oneline "$old..$new" | head -20
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          done < /tmp/subs_old.txt
          git commit -q -m "$MSG"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Subir
        id: push
        if: steps.sync.outputs.merged == 'true' || steps.subs.outputs.changed == 'true'
        run: |
          # solo RBF de la Chameleon96 en releases/
          for f in releases/*.rbf; do
            [ -e "$f" ] || continue
            case "$f" in
              *_ch96.rbf) ;;
              *) git rm -q -f -- "$f" ;;
            esac
          done
          git diff --cached --quiet || git commit -q -m "releases: solo los RBF de la Chameleon96"
          git push origin HEAD:main

      - name: Lanzar la compilacion
        if: steps.push.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        # -R: con el remoto "upstream" anadido arriba, gh toma shaeon/Lynx_MiSTer como repositorio
        # por defecto y alli no existe build_ch96.yml (HTTP 404)
        run: gh workflow run build_ch96.yml --ref main -R "$GITHUB_REPOSITORY"
